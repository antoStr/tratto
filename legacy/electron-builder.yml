appId: app.tratto.desktop
productName: Tratto
directories:
  output: release
  buildResources: build
asar: true
publish:
  - provider: github
    owner: antoStr
    repo: tratto
    releaseType: release
files:
  - dist/**
  - server/**/*.ts
  - "!server/**/*.test.ts"
  - electron/**
  - package.json
win:
  target:
    - target: nsis
      arch: x64
  icon: build/icon.png
  extraResources:
    - from: bin/cloudflared.exe
      to: cloudflared.exe
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Tratto
  artifactName: Tratto-Setup-${version}.${ext}
  installerLanguages: [it_IT]
  language: '1040'
  # Boards live in %APPDATA%\Tratto: build/uninstall.nsh asks before deleting them and removes the rest.
  deleteAppDataOnUninstall: false
  include: build/uninstall.nsh
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.productivity
  icon: build/icon.png
  # No paid Apple Developer ID: scripts/adhoc-sign.cjs signs ad hoc instead (and there are no
  # automatic updates on Mac, see electron/main.ts).
  identity: null
  extraResources:
    - from: bin/cloudflared-darwin-${arch}
      to: cloudflared
dmg:
  artifactName: Tratto-${version}-mac-${arch}.${ext}
linux:
  target:
    - target: AppImage
      arch: x64
    - target: deb
      arch: x64
  category: Graphics
  icon: build/icon.png
  synopsis: Lavagna infinita con penna e condivisione sicura
  maintainer: antoStr <antostr.dev@gmail.com>
  syncDesktopName: true # window and launcher icon match on Wayland
  extraResources:
    - from: bin/cloudflared
      to: cloudflared
appImage:
  artifactName: Tratto-${version}-linux-x86_64.${ext}
deb:
  artifactName: Tratto-${version}-linux-amd64.${ext}
afterPack: scripts/adhoc-sign.cjs
