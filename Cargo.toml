[package]
name = "tratto"
version = "2.6.1"
edition = "2024"
description = "Lavagna infinita con penna e condivisione sicura"
authors = ["antoStr <antostr.dev@gmail.com>"]
homepage = "https://github.com/antoStr/tratto"

# Installers, built by .github/workflows/build.yml: `cargo packager --release --formats nsis|dmg|appimage,deb`.
[package.metadata.packager]
product-name = "Tratto"
identifier = "app.tratto.desktop"
publisher = "antoStr"
category = "Productivity"
icons = ["assets/icon.png", "assets/icon.ico"]
long-description = "Lavagna infinita con penna, forme, note adesive e modelli. Le lavagne restano sul PC; un link fa entrare altre persone dal browser."
# The tunnel program lives next to Tratto (see share::cloudflared); CI downloads it into the build folder.
binaries = [{ path = "tratto", main = true }, { path = "tratto-cloudflared", main = false }]

# Windows signing: the build adds a sign-command calling scripts/sign.ps1 when the repository has
# a code signing certificate (see .github/workflows/build.yml); otherwise nothing is signed.
[package.metadata.packager.nsis]
installer-mode = "currentUser"
languages = ["Italian"]
custom-language-file = { Italian = "assets/nsis/Italian.nsh" }
installer-icon = "assets/icon.ico"
# The uninstaller offers to delete the boards too (unticked by default).
appdata-paths = ["$APPDATA/Tratto"]
# Tratto 1.x (Electron) lived in %LOCALAPPDATA%\Programs\Tratto: its own uninstaller removes it
# silently, keeping the boards (they stay in %APPDATA%\Tratto, where this version reads them).
preinstall-section = '''
Section StopTunnel
  ; A sharing tunnel left running (Tratto closed badly) would keep its file locked.
  nsExec::Exec 'taskkill /F /IM tratto-cloudflared.exe'
SectionEnd
Section RemoveTratto1
  IfFileExists "$LOCALAPPDATA\Programs\Tratto\Uninstall Tratto.exe" 0 done
    ExecWait '"$LOCALAPPDATA\Programs\Tratto\Uninstall Tratto.exe" /S _?=$LOCALAPPDATA\Programs\Tratto'
    Delete "$LOCALAPPDATA\Programs\Tratto\Uninstall Tratto.exe"
    RMDir "$LOCALAPPDATA\Programs\Tratto"
  done:
SectionEnd
'''

[package.metadata.packager.macos]
minimum-system-version = "11.0"
# No paid Apple Developer ID: signed ad hoc, so the first launch needs right click > Open.
signing-identity = "-"

[package.metadata.packager.deb]
section = "graphics"

# Fedora, openSUSE and the other RPM systems: `cargo generate-rpm` (see the build workflow).
[package.metadata.generate-rpm]
summary = "Lavagna infinita con penna e condivisione sicura"
license = "Proprietary"
url = "https://github.com/antoStr/tratto"
assets = [
    { source = "target/release/tratto", dest = "/usr/bin/tratto", mode = "755" },
    { source = "target/release/tratto-cloudflared", dest = "/usr/bin/tratto-cloudflared", mode = "755" },
    { source = "assets/linux/tratto.desktop", dest = "/usr/share/applications/tratto.desktop", mode = "644" },
    { source = "assets/icon.png", dest = "/usr/share/icons/hicolor/512x512/apps/tratto.png", mode = "644" },
]
auto-req = "builtin"

[dependencies]
base64 = "0.23.1"
egui = "0.36.2"
ehttp = "0.7.1"
flate2 = "1.1.10"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
lyon_tessellation = "1.0.22"
resvg = { version = "0.48.1", default-features = false }
rustybuzz = "0.20.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tiny-skia = "0.12.0"
yrs = { version = "0.28.0", features = ["sync"] }

rfd = "0.17.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Our own fonts replace egui's, so its default ones are left out.
eframe = { version = "0.36.2", default-features = false, features = ["accesskit", "links", "wayland", "x11", "wgpu", "glow"] }
# Its default features: windows and decorations on every Linux desktop (pulled in through eframe).
winit = "0.30.13"
arboard = "3.6.1"
axum = { version = "0.8.9", features = ["ws"] }
dirs = "7.0.0"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
getrandom = "0.4.3"
# The invitation link as a QR code, for a phone's camera.
qrcodegen = "1.8.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "net", "sync", "time", "macros", "process", "io-util"] }
webbrowser = "1.2.4"

# The guests' page: the same app in the browser, drawn with WebGL.
[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["glow", "web_screen_reader"] }
js-sys = "0.3.106"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.106", features = ["WebSocket", "MessageEvent", "BinaryType", "CloseEvent", "Window", "Location", "Storage", "HtmlCanvasElement", "Document", "Element", "Blob", "Url", "HtmlAnchorElement", "AudioContext", "BaseAudioContext", "AudioContextState", "AudioBuffer", "AudioBufferSourceNode", "AudioScheduledSourceNode", "AudioNode", "AudioParam", "GainNode", "AudioDestinationNode", "Event", "EventTarget"] }

# The timer's music: ALSA loaded at run time on Linux (nothing to install to build), cpal elsewhere.
[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.8.9"
# The desktop's light or dark preference (winit doesn't read it on Linux); already built for
# eframe's accessibility, only its blocking calls added.
zbus = { version = "5.19.0", default-features = false, features = ["async-io", "blocking-api"] }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
cpal = "0.18.2"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_Pointer", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_StationsAndDesktops"] }

# The icon of Tratto.exe (and of its shortcuts).
[target."cfg(windows)".build-dependencies]
winresource = "0.1"

[dev-dependencies]
egui_kittest = { version = "0.36.2", features = ["wgpu", "snapshot"] }

[profile.dev]
debug = "line-tables-only"

# Dependencies optimised and without debug info: a fast board while developing, a small target folder.
[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

# The guests' page: small to download through the tunnel.
[profile.web]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
