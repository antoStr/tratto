<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>Tratto</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f5f5f5; font: 14px/1.4 system-ui, sans-serif; color: #1e1e1e; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; touch-action: none; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; margin: 0; padding: 16px; text-align: center; }
  @media (prefers-color-scheme: dark) { html, body { background: #2c2c2c; color: #fff; } }
</style>
</head>
<body>
<canvas id="tratto"></canvas>
<p id="loading" role="status">Apro la lavagna…</p>
<noscript><p>Per usare la lavagna attiva JavaScript.</p></noscript>
<script type="module" src="main.js"></script>
</body>
</html>
