name: build-windows

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write # needed only to publish the release on tag pushes

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/fetch-cloudflared.ts win
      # Manual run: artifact only. Tag push (v*): publish .exe + .blockmap + latest.yml to a GitHub Release.
      - if: github.ref_type != 'tag'
        run: npx electron-builder --win --x64 --publish never
      - if: github.ref_type == 'tag'
        run: npx electron-builder --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: Tratto-Windows
          path: release/*.exe
          if-no-files-found: error
